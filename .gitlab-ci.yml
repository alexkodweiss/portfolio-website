# Builds the Vite site and publishes it to GitLab Pages on every push to main.
image: node:22

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    - cp dist/index.html dist/404.html  # SPA fallback for client-side routes
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
